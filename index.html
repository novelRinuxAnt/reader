<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Novel Reader</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="reader-header">

        <div class="header-left">
            <button id="backButton" class="header-button">
                ←
            </button>

            <div>
                <div class="brand">
                    Novel RinuxAnt
                </div>

                <div id="readerStatus">
                    Memuat novel...
                </div>
            </div>
        </div>

        <button id="logoutButton"
                class="header-button logout-button">
            Keluar
        </button>

    </header>


    <main id="reader">

        <div id="loading" class="loading">

            <div class="loading-spinner"></div>

            <div>
                Memuat halaman...
            </div>

        </div>


        <div id="errorBox"
             class="error-box"
             hidden>

            <div class="error-title">
                Gagal memuat Reader
            </div>

            <div id="errorMessage">
                Terjadi kesalahan.
            </div>

            <button id="retryButton"
                    class="retry-button">
                Coba Lagi
            </button>

        </div>


        <div id="pages"
             class="pages">
        </div>

    </main>


    <footer class="reader-footer">

        <span id="pageCounter">
            0 / 0
        </span>

    </footer>


    <script src="script.js"></script>

</body>
</html>
